<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!--TITLE--></title>
<meta name="description" content="<!--DESC-->">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6">
<!-- 防闪烁脚本。本体在 build.mjs 的 THEME_HEAD 里，三个页面共用一份 ——
     它必须内联且同步（赶在外链样式表之前），所以不能去加载 store.js，那太晚了。 -->
<!--THEME_HEAD-->
<link rel="stylesheet" href="engine/style.css?v=<!--V:style.css-->">
<script src="engine/store.js?v=<!--V:store.js-->"></script>
<!-- 门禁：抢在正文渲染之前判一次。app.js 的 init 里还会再 await 同一个 promise
     （store.guard() 一页只判一次，不会重复跳），那是兜底。
     存储不可用时 guard 放行 —— 理由写在 store.js 里，别改成拦住。 -->
<script>PETStore.guard().catch(function(){});</script>
</head>
<body>

<div class="topbar">
  <a class="tool" id="btnHome" href="index.html" title="回到首页">← 首页</a>
  <div class="brand">PET 精读<small><!--LABEL--></small><span class="who" id="who" hidden></span></div>

  <div class="tabs">
    <button class="tab on" data-tab="read">原文精读</button>
    <button class="tab" data-tab="quiz">题目分析</button>
    <button class="tab" data-tab="sum" id="tabSum" hidden>总结</button>
  </div>

  <div class="spacer"></div>

  <div class="tools">
    <span class="voice-warn" id="voiceWarn" hidden></span>

    <label class="zoom" title="只放大原文和小黑板，历史不受影响">
      <span id="zoomLabel">1x</span>
      <input type="range" id="zoomRange" min="1" max="5" step="0.5" value="1">
    </label>

    <button class="tool" id="tglTheme" title="主题：跟随系统">◐ 跟随</button>
    <button class="tool on" id="tglAna" title="显示 / 隐藏小黑板">▣ 小黑板</button>
    <button class="tool" id="tglVocab" title="显示 / 隐藏历史浮动面板">▣ 历史</button>
    <button class="tool" id="tglQuiz">做题模式</button>
    <button class="tool" id="btnClear">清空历史</button>
  </div>
</div>

<!-- 两列各占一半。历史不在网格里，是右侧浮层。
     窄屏（<1100px）由 CSS 把右列改成从底部升起的抽屉，DOM 一份不动。
     目录列（tocCol）默认收起：点第一列头上那个「☰ 目录」开合 ——
     宽屏时它占最左边一列，窄屏时（<1100px）变成从左侧滑出的浮层。
     开合状态不持久化：每次进来都按「默认收起」来（需求就是这么定的）。 -->
<div class="cols">
  <!-- 目录列：整本书的题目列表，点哪篇跳哪篇 -->
  <aside class="col toc-col" id="tocCol">
    <div class="col-head">
      <span>目录</span>
      <button class="collapse" id="tocClose" type="button" title="收起目录">✕</button>
    </div>
    <div class="col-body" id="tocBody"></div>
  </aside>

  <!-- 第一列：原文 + 题目 -->
  <div class="col" id="col1">
    <div class="col-head">
      <button class="toc-btn" id="tglToc" type="button" title="显示 / 隐藏目录">☰ 目录</button>
      <span id="col1Title">原文</span>
      <span class="hint" id="col1Hint">点词查词 · 点句子看讲解 · <span style="background:var(--phrase);padding:0 4px;border-radius:3px">黄色</span>是词组</span>
    </div>
    <div class="col-body">
      <div id="passage"></div>
      <!-- 原文页 = 文章 + 题目。题目和文章一样：词可点、词组标黄、句子可讲解 -->
      <div id="qListRead" hidden></div>
      <div id="qList" hidden></div>
      <!-- 总结页（Part 6 起）：把书上笔记里的词组/句型整理成一篇的清单，可点开、可收藏 -->
      <div id="sumList" hidden></div>
    </div>
  </div>

  <!-- 第二列：小黑板（点词 / 点句子 / 点答题解析都显示在这里） -->
  <div class="col" id="colAna">
    <div class="col-head">
      <span>小黑板</span>
      <span class="hint" id="colAnaHint">点单词或句子</span>
      <button class="collapse" data-collapse="ana" title="收起小黑板">✕</button>
    </div>
    <div class="col-body" id="analysis"></div>
  </div>
</div>

<!-- 窄屏抽屉升起时压住正文的那层灰。宽屏下 CSS 让它彻底不存在。
     点它 = 收起抽屉，和 .collapse 同一条路径 -->
<div class="scrim" id="scrim"></div>

<!-- 历史：右侧浮层，点顶栏「历史」滑出。字体不参与缩放 -->
<aside class="hist-float" id="histFloat" hidden>
  <div class="hist-head">
    <span>历史</span>
    <span class="hist-hint">点过的都记在这 · 按词全局收藏</span>
    <button class="hist-close" id="histClose" title="收起历史">✕</button>
  </div>
  <div class="hist-body" id="history"></div>
</aside>

<script>window.PET_CONTENT = <!--CONTENT-->;window.PET_TOC = <!--TOC-->;</script>
<script src="engine/app.js?v=<!--V:app.js-->"></script>
</body>
</html>
