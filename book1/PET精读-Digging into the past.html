<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PET 精读 · Digging into the past</title>
<style>
/* ===== PET 精读自学页 ===== */
:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --ink:#1e2430;
  --ink-2:#5a6474;
  --ink-3:#8b95a6;
  --line:#e3e7ee;
  --line-2:#eef1f6;
  --accent:#2f6fed;
  --accent-soft:#e8f0ff;
  --phrase:#ffe98a;
  --phrase-hover:#ffd93d;
  --sent-alt:#fdf6da;          /* 句子交替底色里的"淡黄"那一档 */
  --ins-bg:#e7f6ec;
  --ins-line:#3aa864;
  --hard:#e8833a;
  --hard-bg:#fdf1e6;
  --zoom:1;                    /* 字号缩放倍数，只作用于原文与小黑板 */
  --radius:10px;
  --shadow:0 1px 3px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.05);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:0}

.tabs{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:var(--radius)}
.tab{
  padding:6px 16px;border-radius:7px;font-size:14px;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.spacer{flex:1}
/* 字号缩放滑动条 */
.zoom{
  display:inline-flex;align-items:center;gap:9px;
  padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
}
.zoom > span{
  font-size:12.5px;font-weight:700;color:var(--accent);min-width:32px;text-align:center;
}
.zoom input[type=range]{
  width:108px;accent-color:var(--accent);cursor:pointer;margin:0;
}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;color:var(--ink-2);background:var(--panel);
  transition:all .15s;
}
.tool:hover{border-color:#c9d3e4;color:var(--ink)}
.tool.on{background:var(--accent-soft);border-color:#b9cffb;color:var(--accent);font-weight:600}
.voice-warn{
  font-size:12px;color:#a8641a;background:#fdf3e3;border:1px solid #f2ddb8;
  padding:4px 10px;border-radius:7px;
}
/* 发送到邮箱 */
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool:disabled:hover{border-color:var(--line);color:var(--ink-2)}
.mail-msg{
  font-size:12px;padding:4px 11px;border-radius:7px;max-width:340px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--line-2);color:var(--ink-2);
}
.mail-msg.ok{background:#e7f6ec;color:#1d7a45;border:1px solid #c9ecd5}
.mail-msg.err{background:#fdeaea;color:#c0392b;border:1px solid #f5c6c6}

/* ---------- 两列各半：原文 / 小黑板 ----------
   历史不占网格，是右侧浮层（.hist-float） */
.cols{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;padding:14px;
  flex:1;min-height:0;
}
.cols.hide-ana{grid-template-columns:minmax(0,1fr)}
/* 必须 display:none，否则被收起的列仍会占一个网格轨道 */
.cols.hide-ana #colAna{display:none}

/* ---------- 历史浮层 ---------- */
.hist-float{
  position:fixed;top:64px;right:14px;bottom:14px;width:330px;
  background:var(--panel);border-radius:14px;
  box-shadow:0 10px 40px rgba(20,30,50,.18),0 2px 8px rgba(20,30,50,.1);
  border:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  z-index:40;
  animation:slidein .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
/* 必须显式写这条：上面 .hist-float 的 display:flex 是作者样式，
   会盖掉浏览器默认样式表里的 [hidden]{display:none}，导致 hidden 属性失效、
   面板永远关不掉。作者样式无论优先级都赢过 UA 样式表。 */
.hist-float[hidden]{display:none}
.hist-head{
  display:flex;align-items:center;gap:8px;flex:none;
  padding:11px 12px 11px 16px;border-bottom:1px solid var(--line-2);
  font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;
}
.hist-hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:11.5px;margin-left:auto}
.hist-close{
  flex:none;width:22px;height:22px;border-radius:6px;font-size:11px;
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.hist-close:hover{background:#fdeaea;color:#d64545}
.hist-body{overflow-y:auto;overflow-x:hidden;padding:10px 12px 14px;flex:1}
.hist-body::-webkit-scrollbar{width:9px}
.hist-body::-webkit-scrollbar-thumb{background:#d6dce8;border-radius:5px}

#col1{font-size:calc(17px * var(--zoom))}
#colAna{font-size:calc(16px * var(--zoom))}
.col{
  background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  min-width:0;min-height:0;
}
.col-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 16px;border-bottom:1px solid var(--line-2);
  font-size:calc(12px * var(--zoom));font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;flex:none;
}
.col-head .hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:calc(12px * var(--zoom));margin-left:auto}
.col-head .collapse{
  flex:none;width:calc(22px * var(--zoom));height:calc(22px * var(--zoom));border-radius:6px;font-size:calc(11px * var(--zoom));line-height:1;
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.col-head .collapse:hover{background:#fdeaea;color:#d64545}
/* overflow-x 必须显式写 hidden：只写 overflow-y:auto 时 x 轴会计算成 auto，
   一旦内容溢出就会冒出横向滚动条 */
.col-body{overflow-y:auto;overflow-x:hidden;padding:16px;flex:1;scroll-behavior:smooth}
.col-body::-webkit-scrollbar{width:9px}
.col-body::-webkit-scrollbar-thumb{background:#d6dce8;border-radius:5px}
.col-body::-webkit-scrollbar-thumb:hover{background:#c2cbdb}

/* ---------- 原文 ---------- */
.passage-title{
  font-size:calc(20px * var(--zoom));font-weight:700;margin:2px 0 4px;letter-spacing:.2px;
}
.passage-meta{font-size:calc(12.5px * var(--zoom));color:var(--ink-3);margin-bottom:16px}
.para{margin:0 0 15px}
/* 句子连续排版：inline，不换行。
   靠交替底色区分句界，靠右侧页边的悬浮按钮操作 */
.sent{
  display:inline;
  padding:2px 3px;border-radius:5px;
  cursor:pointer;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  transition:background .15s;
}
.sent.alt{background:var(--sent-alt)}          /* 奇数句：淡黄 */
.sent:hover{background:#dceaff !important}
/* 鼠标停在页边的「析」上时，对应那句变粉，指明这个按钮管的是哪一句 */
.sent.peek{background:#ffd6e8 !important;box-shadow:0 0 0 1px #f7a8c8}
.sent.cur{background:#c9ddff !important;box-shadow:0 0 0 1px #9dbcf7}
.sent-txt{}

/* 正文右侧留出页边，放每句的按钮 */
#passage{position:relative;padding-right:calc(58px * var(--zoom))}
.pgutter{position:absolute;top:0;right:0;width:calc(52px * var(--zoom));pointer-events:none}
.sbtns{
  position:absolute;right:0;width:calc(52px * var(--zoom));
  display:flex;gap:3px;justify-content:flex-end;
  pointer-events:auto;
}
.sbtns .mini{background:var(--panel);box-shadow:0 1px 2px rgba(20,30,50,.12);opacity:.72}
.sbtns .mini:hover{opacity:1;background:var(--accent-soft)}
.sbtns.cur .mini{opacity:1;background:var(--accent-soft)}

/* 窄屏放不下页边：隐藏按钮栏。喇叭改从小黑板顶部调用，不会没得用 */
@media(max-width:1180px){
  #passage{padding-right:0}
  .pgutter{display:none}
}

/* 单词 */
.w{
  border-radius:4px;padding:1px 1px;cursor:pointer;
  transition:background .12s,color .12s;
}
.w:hover{background:var(--accent-soft);color:var(--accent)}
.w.act{background:var(--accent);color:#fff}

/* 词组 */
.ph{
  background:var(--phrase);border-radius:4px;padding:1px 2px;cursor:pointer;
  box-shadow:inset 0 -1px 0 rgba(180,140,0,.25);
  transition:background .12s;
}
.ph:hover{background:var(--phrase-hover)}
.ph.act{background:var(--accent);color:#fff;box-shadow:none}

/* 填空题干与答案句 */
.blank{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:calc(34px * var(--zoom));height:calc(22px * var(--zoom));padding:0 7px;margin:0 3px;
  background:#eef1f6;border:1.5px dashed #b9c3d4;border-radius:6px;
  font-size:calc(12.5px * var(--zoom));font-weight:700;color:var(--ink-3);vertical-align:1px;
  cursor:pointer;transition:all .15s;
}
.blank:hover{border-color:var(--accent);color:var(--accent)}
.blank.filled{background:var(--ins-bg);border:1.5px solid var(--ins-line);color:#1d7a45}
.blank.act{background:var(--accent);border-color:var(--accent);color:#fff}
body.quiz .blank{background:#eef1f6;border-style:dashed;border-color:#b9c3d4;color:var(--ink-3)}

/* 长难句不再单独上底色 —— 那会盖掉「淡黄 / 白」的交替节奏。
   现在每句都能点、都有讲解，长难句的区分意义已经不大了。
   hard 标记仍保留在数据里，顶栏那行「长难句 12 句」还在。 */

/* 页边与面板里的小按钮 */
.mini{
  width:calc(24px * var(--zoom));height:calc(22px * var(--zoom));border-radius:5px;font-size:calc(12px * var(--zoom));line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);transition:all .12s;
}
.mini:hover{background:var(--accent-soft);color:var(--accent)}
.mini.on{background:var(--accent);color:#fff}
.mini.speaking{background:#ffe1e1;color:#d64545}

/* ---------- 历史记录列 ---------- */
/* 行是 div，里面两个平级 button（button 不能嵌套 button） */
.hitem{
  display:flex;align-items:center;gap:2px;
  border-radius:8px;margin-bottom:2px;border:1px solid transparent;
  transition:background .12s,border-color .12s;
  animation:pop .18s ease-out;
}
.hitem:hover{background:#f4f7fc;border-color:var(--line)}
.hitem.cur{background:var(--accent-soft);border-color:#b9cffb}
.hopen{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  text-align:left;padding:7px 4px 7px 9px;border-radius:8px;
}
.hbadge{
  flex:none;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
}
.hitem.w .hbadge{background:#4a86e8}          /* 词：蓝 */
.hitem.s .hbadge{background:#e08a3c}          /* 句：橙 */
/* 词条行：英文一行、中文一行。只留这两项，音标和词性去掉了 */
.hbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hlabel{
  flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hitem.w .hlabel{font-weight:700}
.hitem.s .hlabel{font-weight:400;color:var(--ink-2)}
.hcn{
  font-size:12px;color:var(--ink-2);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hitem.w{align-items:flex-start}
.hitem.w .hopen{align-items:flex-start}
.hitem.w .hbadge{margin-top:1px}
.hdel{
  flex:none;font-size:12px;color:var(--ink-3);padding:4px 7px;border-radius:5px;
  opacity:0;transition:opacity .12s;
}
.hitem:hover .hdel{opacity:1}
.hdel:hover{background:#fdeaea;color:#d64545}

/* ---------- 生词本 ---------- */
.empty{
  color:var(--ink-3);font-size:calc(13.5px * var(--zoom));text-align:center;
  padding:36px 16px;line-height:1.9;
}
.empty .big{font-size:calc(26px * var(--zoom));display:block;margin-bottom:8px;opacity:.5}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.vpos{
  background:var(--ink-3);color:#fff;border-radius:20px;
  padding:0 7px;font-weight:700;white-space:nowrap;
}

/* ---------- 句子分析 ---------- */
.ana{animation:pop .2s ease-out}
.ana-h{
  font-size:calc(13px * var(--zoom));font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;margin:0 0 10px;
  display:flex;align-items:center;gap:8px;
}
.ana-h .ana-spk{
  font-size:calc(12px * var(--zoom));color:var(--accent);letter-spacing:0;
  text-transform:none;font-weight:600;
  border:1px solid #cfe0ff;background:#f5f9ff;border-radius:6px;padding:3px 10px;
  display:inline-flex;align-items:center;gap:5px;
}
.ana-h .ana-spk:hover{background:var(--accent-soft)}
/* 顶部区：原句 + 标题吸顶。小黑板内容长，滚到下面时原句不能跑掉 */
.ana-top{
  position:sticky;top:-16px;z-index:6;
  background:var(--panel);
  padding:16px 0 10px;margin:-16px 0 0;
}
/* 原句：紧凑的灰色圆角方框 + 加粗（分析栏空间小，这里要省地方） */
.ana-sent{
  font-size:calc(15px * var(--zoom));font-weight:700;line-height:1.6;
  background:#eceef2;border-radius:10px;
  padding:8px 11px;
  word-break:break-word;
}
/* 句型定位到的片段 */
.ana-sent .hl{
  background:#ffd9d9;color:#b32020;
  border-radius:4px;padding:1px 3px;
  box-shadow:0 0 0 2px rgba(214,69,69,.22);
}
/* 只在动画期间变成 inline-block（transform 对纯 inline 元素无效），
   动完就摘掉这个类，文字恢复正常的换行行为 */
.ana-sent .hl.reveal{
  display:inline-block;
  transform-origin:center;
  animation:hlpop .5s cubic-bezier(.2,.8,.3,1);
}
@keyframes hlpop{
  0%{transform:scale(1.1)}
  60%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.sec{margin-bottom:14px}
.sec-t{
  font-size:calc(13.5px * var(--zoom));font-weight:700;color:var(--accent);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.sec-t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
.sec-b{font-size:calc(15px * var(--zoom));line-height:1.8;color:var(--ink-2)}
.sec-b b{color:var(--ink)}
.sec-b code{
  background:#eef1f6;padding:1px 6px;border-radius:4px;font-size:calc(13.5px * var(--zoom));
  font-family:"Cascadia Code",Consolas,monospace;color:#b3402f;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{
  font-size:calc(13px * var(--zoom));padding:3px 10px;border-radius:20px;
  background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip.cl{background:#eef3ff;border-color:#d3e0fb;color:#2b5bc4}
.chip.ph2{background:#fff8dd;border-color:#eddfa4;color:#8a6a05}
.chip.ph3{background:transparent;border-style:dashed;color:var(--ink-3)}
.chip.gr{background:#eefaf1;border-color:#c9ecd5;color:#1d7a45}
.chip.pat{background:#f1eefe;border-color:#dcd3fb;color:#5b3fd1}
.chip.pat0{background:#5b3fd1;border-color:#5b3fd1;color:#fff;font-weight:700}
/* 句型 chip 可点：点了就在上面原句里标出对应成分 */
button.chip.pat{cursor:pointer}
button.chip.pat:hover{background:#e4dcfd;border-color:#c4b5f7}
button.chip.pat.on{
  background:#d64545;border-color:#d64545;color:#fff;font-weight:700;
  box-shadow:0 0 0 3px rgba(214,69,69,.18);
}
button.chip.pat.static{cursor:default;opacity:.75}
button.chip.pat.static:hover{background:#f1eefe;border-color:#dcd3fb}
button.chip{cursor:pointer;transition:filter .12s}
button.chip:hover{filter:brightness(.94)}
button.chip.ph2:hover{background:var(--phrase-hover)}

/* 成分拆解：一项一张圆角卡片，成分名在上、内容在下。
   底色由 JS 按序号从浅灰递深，文字颜色也随之切换 */
.parts{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.part{border-radius:9px;padding:7px 11px}
.part .pname{
  display:block;font-size:calc(12.5px * var(--zoom));font-weight:700;letter-spacing:.5px;
  opacity:.78;white-space:nowrap;margin-bottom:2px;   /* 标签一行，不换行 */
}
.part .pbody{display:block;font-size:calc(15px * var(--zoom));line-height:1.65}
.part code{
  background:rgba(128,128,128,.2);color:inherit;font-weight:600;
  padding:0 5px;border-radius:4px;
  font-family:"Cascadia Code",Consolas,monospace;font-size:calc(13px * var(--zoom));
}

/* ---------- 题目 ---------- */
.qcard{
  border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;
  transition:border-color .15s,box-shadow .15s;
}
/* 原文页里那份题目：与正文分隔的开头标题 */
.qsec-h{
  font-size:calc(12px * var(--zoom));font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  margin:24px 0 11px;padding-top:16px;border-top:1px solid var(--line);
}
.qcard.open{border-color:#cfe0ff;box-shadow:0 2px 12px rgba(47,111,237,.09)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.qnum{
  width:calc(27px * var(--zoom));height:calc(27px * var(--zoom));flex:none;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--zoom));font-weight:700;
}
.qtxt{font-size:calc(15.5px * var(--zoom));font-weight:600;line-height:1.75;flex:1}
.qans{
  display:flex;align-items:center;gap:9px;margin-top:11px;padding:10px 12px;
  background:var(--ins-bg);border-radius:8px;border:1px solid #c9ecd5;
}
.qans .lbl{font-size:calc(12px * var(--zoom));font-weight:700;color:#1d7a45;letter-spacing:.5px;flex:none}
.qans .letter{
  width:calc(24px * var(--zoom));height:calc(24px * var(--zoom));flex:none;border-radius:6px;background:#1d7a45;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--zoom));font-weight:700;
}
.qans .atxt{flex:1;font-size:calc(14.5px * var(--zoom));line-height:1.7}
.qbtns{display:flex;gap:8px;margin-top:11px}
.btn{
  padding:6px 14px;border-radius:7px;font-size:calc(13px * var(--zoom));border:1px solid var(--line);
  color:var(--ink-2);background:var(--panel);display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;
}
.btn:hover{border-color:#c9d3e4;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#2560d8;color:#fff}
.btn.on{background:var(--accent-soft);border-color:#b9cffb;color:var(--accent);font-weight:600}

.opt{
  display:flex;gap:10px;flex-wrap:wrap;padding:9px 11px;border-radius:8px;margin-bottom:5px;

}
.opt:hover{background:#f7f9fc}
.opt .ol{
  width:calc(22px * var(--zoom));height:calc(22px * var(--zoom));flex:none;border-radius:5px;background:var(--line-2);color:var(--ink-2);

}
.opt.right{background:var(--ins-bg);border-color:#c9ecd5}

.opt.used{background:#f4f6fa;border-color:var(--line)}
.opt .otxt{flex:1;min-width:0}
.opt .tag{
  font-size:calc(11.5px * var(--zoom));padding:1px 8px;border-radius:20px;align-self:flex-start;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap;flex:none;
}
/* 每条备选句右边的三个动作 */
.oacts{display:flex;gap:4px;flex:none;align-self:flex-start}
.obtn{
  font-size:calc(11.5px * var(--zoom));line-height:1;padding:5px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  white-space:nowrap;transition:all .12s;
}
.obtn:hover{border-color:#b9cffb;background:var(--accent-soft);color:var(--accent)}
.obtn[data-ana]{border-color:#dcd3fb;color:#5b3fd1}
.obtn[data-ana]:hover{background:#f1eefe;border-color:#c4b5f7}
.obtn[data-qexp]{border-color:#c9ecd5;color:#1d7a45}
.obtn[data-qexp]:hover{background:#eefaf1;border-color:#9fd9b6}
.opt.cur{border-color:var(--accent);background:var(--accent-soft)}
.traprow{padding:5px 0;border-bottom:1px dashed var(--line-2);line-height:1.7}
.traprow:last-child{border-bottom:none}
.opt.right .tag{background:#1d7a45;color:#fff}
.opt.used .tag{background:#dfe4ee;color:var(--ink-2)}

.qa-sec{margin-top:13px}
.qa-sec:first-child{margin-top:0}
.qa-t{
  font-size:calc(13.5px * var(--zoom));font-weight:700;color:var(--accent);
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.qa-t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
.qa-b{font-size:calc(15px * var(--zoom));line-height:1.85;color:var(--ink-2)}
.qa-b b{color:var(--ink)}
.qa-b code{background:#eef1f6;padding:1px 6px;border-radius:4px;font-family:"Cascadia Code",Consolas,monospace;font-size:calc(13.5px * var(--zoom));color:#b3402f}

/* 窄屏：一律单列堆叠。必须带上 hide-* 变体，否则上面的列宽规则

  body{overflow:auto;height:auto;min-height:100vh}

  .col{max-height:78vh;min-height:0}

<script>
/* ============================================================
   PET 精读 · 内容数据
   来源：剑桥PET官方模考题精讲讲练 · Exam Practice Test 1 · Reading Part 4
   文章：Digging into the past（Questions 16–20，五选句填空）
   ============================================================ */
window.PET_CONTENT = {

  meta: {
    label: "Exam Practice Test 1 · Reading Part 4",
    note: "答案为依据上下文推断，请对照书后 P185 核对"
  },

  passage: {
    title: "Digging into the past",
    words: 319,
    sentences: 22,
    /* 句型（ana.pat）覆盖说明 —— 免得日后误以为漏了：
       本文没有 There be 句、没有强调句（it is … that …）、
       没有完全倒装或疑问倒装。真正的倒装只有 2 处「引语倒装」（2-1 和 3-4 的 Says Kate）。
       pat[0] 取自主句型封闭集：主谓宾 / 主系表 / 主谓双宾 / 主谓 / 倒装引语，
       verify.cjs 用这个白名单卡错别字。 */
    paragraphs: [

      /* ---------- 第 1 段 ---------- */
      [
        {
          s: "Last year, Kate Marshall was given a very exciting opportunity – to help her father, who's a history lecturer, at a historical site!",
          hard: true,
          tr: "去年，凯特·马歇尔得到了一个非常令人兴奋的机会——去一个历史遗址帮她父亲，她父亲是一位历史讲师！",
          ana: {
            pat: ["主谓宾", "被动语态", "非限制性定语从句"],
            frame: "主干：<b>Kate Marshall was given an opportunity</b>（凯特获得了一个机会）",
            parts: [
              ["主语", "Kate Marshall"],
              ["谓语", "<code>was given</code> —— 一般过去时的被动语态（was/were + 过去分词）"],
              ["宾语", "a very exciting opportunity"],
              ["同位语", "<code>to help her father ... at a historical site</code> —— 破折号引出的不定式，解释这个 opportunity 具体是什么"],
              ["定语从句", "<code>who's a history lecturer</code> —— 非限制性定语从句，补充说明 father"],
              ["地点状语", "at a historical site"]
            ],
            clauses: ["非限制性定语从句 who's...", "不定式作同位语（解释机会的内容）"],
            gram: ["被动语态", "非限制性定语从句", "不定式作同位语"],
            tip: "被动语态 <code>was given</code> 直译是“被给予”，中文习惯说成<b>“得到了”</b>。破折号后面的不定式要提到前面去译——先说“一个…的机会”，再说机会是什么。这是英文“先抽象后具体”、中文“先具体后抽象”的典型差异。",
            phrases: ["a very exciting opportunity", "a historical site", "history lecturer"]
          }
        },
        {
          s: "He was leading a team to dig up and explore the area.",
          tr: "他正带着一个团队挖掘并勘探这片区域。",
          ana: {
            pat: ["主谓宾", "不定式作目的状语"],
            frame: "主干：<b>He was leading a team</b>（他正带着一个团队）",
            parts: [
              ["主语", "He（指凯特的父亲）"],
              ["谓语", "<code>was leading</code> —— 过去进行时，表示当时正在进行的动作"],
              ["宾语", "a team"],
              ["目的状语", "<code>to dig up and explore the area</code> —— 不定式表目的，两个动词并列"]
            ],
            clauses: ["不定式作目的状语"],
            gram: ["过去进行时", "不定式表目的", "并列不定式"],
            tip: "英文目的状语放后面，中文习惯放前面：<b>“他正带着一个团队去挖掘和勘探这片区域”</b>。两个不定式 <code>dig up</code> 和 <code>explore</code> 共用一个 to，这叫“并列不定式”，第二个 to 省略。",
            phrases: ["dig up", "lead a team"]
          }
        }
      ],

      /* ---------- 第 2 段 ---------- */
      [
        {
          s: "When they arrived, though, the site wasn't quite what Kate had expected.",
          hard: true,
          tr: "不过，等他们到了之后，现场和凯特预想的不太一样。",
          ana: {
            pat: ["主系表", "表语从句", "时间状语从句"],
            frame: "主干：<b>the site wasn't quite what Kate had expected</b>（现场和凯特预想的不太一样）",
            parts: [
              ["时间状语从句", "<code>When they arrived</code>"],
              ["插入语", "<code>though</code> —— 插在句中表转折，前后加逗号"],
              ["主语", "the site"],
              ["系动词", "wasn't"],
              ["表语从句", "<code>what Kate had expected</code> —— what 引导的名词性从句作表语"]
            ],
            clauses: ["时间状语从句 when...", "表语从句 what...", "though 作插入语"],
            gram: ["表语从句", "时间状语从句", "插入语", "过去完成时"],
            tip: "<b>not quite</b> 不是“不相当”，而是<b>“不完全、不太”</b>，语气比 not 委婉。<code>what Kate had expected</code> 直译“凯特所预料的东西”，中文说成<b>“跟凯特想的不太一样”</b>更自然。had expected 用过去完成时，是因为“预料”发生在“到达”之前。",
            phrases: ["wasn't quite"]
          }
        }
      ],

      /* ---------- 第 3 段 ---------- */
      [
        {
          s: "{16}So the first job was to remove it all and prepare the land for digging.",
          tr: "所以第一件事就是把它们全部清掉，把地整出来准备挖掘。",
          ana: {
            pat: ["主系表", "不定式作表语"],
            frame: "主干：<b>the first job was to remove it all and prepare the land</b>（第一件事是清掉它们、把地整出来）",
            parts: [
              ["主语", "the first job"],
              ["系动词", "was"],
              ["表语", "<code>to remove it all and prepare the land</code> —— 不定式作表语"],
              ["目的状语", "for digging"]
            ],
            clauses: ["不定式作表语"],
            gram: ["不定式作表语", "代词指代", "并列不定式"],
            tip: "<b>it all</b> 是理解第 16 题的关键——它是一个代词，必须指向前文出现过的东西（也就是草）。翻译时不能照字面译“它全部”，要还原成<b>“把它们全部清掉”</b>。",
            phrases: ["the first job", "prepare ... for"]
          }
        },
        {
          s: "Says Kate, 'Dad hadn't warned me I'd have to work so hard as soon as we got there!'",
          hard: true,
          tr: "凯特说：“爸爸根本没提醒过我，一到那儿我就得干这么重的活！”",
          ana: {
            pat: ["倒装引语", "宾语从句", "时间状语从句"],
            frame: "主干：<b>Says Kate, ...</b>（凯特说……）—— 引语倒装结构",
            parts: [
              ["谓语 + 主语", "<code>Says Kate</code> —— 倒装，正常语序是 Kate says"],
              ["宾语从句", "<code>Dad hadn't warned me (that) I'd have to work so hard</code> —— warn sb that... 结构"],
              ["时间状语从句", "<code>as soon as we got there</code>"]
            ],
            clauses: ["引语倒装 Says Kate", "warn sb (that) 宾语从句", "as soon as 时间状语从句"],
            gram: ["引语倒装", "过去完成时", "warn sb that 从句", "as soon as"],
            tip: "英文引语常用 <b>Says + 人名</b> 倒装（新闻报道里尤其多），中文照常译“凯特说”。<code>hadn't warned</code> 用过去完成时，强调“在到达之前就没提醒过”。<b>as soon as</b> = 一…就…，是 PET 高频短语。",
            phrases: ["as soon as", "have to", "so hard"]
          }
        }
      ],

      /* ---------- 第 4 段 ---------- */
      [
        {
          s: "But when the site was completely cleared, the team found pieces of ancient pots on the ground.",
          tr: "等现场被彻底清理干净后，团队在地面上发现了古代陶罐的碎片。",
          ana: {
            pat: ["主谓宾", "时间状语从句", "被动语态"],
            frame: "主干：<b>the team found pieces of ancient pots</b>（团队发现了古代陶罐的碎片）",
            parts: [
              ["时间状语从句", "<code>when the site was completely cleared</code> —— 从句本身是被动语态"],
              ["主语", "the team"],
              ["谓语", "found"],
              ["宾语", "pieces of ancient pots"],
              ["地点状语", "on the ground"]
            ],
            clauses: ["时间状语从句（被动）"],
            gram: ["时间状语从句", "被动语态", "名词作定语（ancient pots）"],
            tip: "<b>pieces of ancient pots</b> 是“名词 + of + 名词”的所有关系，中文倒过来译“古代陶罐的碎片”。这种 of 结构在英文里很常见，翻译时基本都要把顺序颠倒。",
            phrases: ["pieces of"]
          }
        },
        {
          s: "However, those weren't as exciting as everyone had thought.",
          hard: true,
          tr: "然而，这些东西并没有大家想的那么让人兴奋。",
          ana: {
            pat: ["主系表", "as…as 比较句"],
            frame: "主干：<b>those weren't as exciting as everyone had thought</b>（那些东西没大家想的那么令人兴奋）",
            parts: [
              ["主语", "those（指上句的陶罐碎片）"],
              ["系动词", "weren't"],
              ["表语", "as exciting"],
              ["比较状语从句", "<code>as everyone had thought</code> —— 从句里省略了 they would be"]
            ],
            clauses: ["as...as 比较结构", "比较从句中的省略", "过去完成时"],
            gram: ["as...as 比较结构", "比较从句省略", "过去完成时"],
            tip: "<b>not as + 形容词 + as</b> = “不如…那么…”，是比较级的常考句型。从句 <code>as everyone had thought</code> 后面其实省略了 <code>they would be</code>，完整是 as everyone had thought they would be。<b>had thought</b> 用过去完成时，因为“以为”发生在“发现”之前。",
            phrases: ["as ... as"]
          }
        },
        {
          s: "Kate's dad told them that the important pots were still under the ground.",
          tr: "凯特的爸爸告诉他们，真正重要的陶罐还在地下。",
          ana: {
            pat: ["主谓双宾", "宾语从句"],
            frame: "主干：<b>Kate's dad told them that...</b>（凯特爸爸告诉他们……）",
            parts: [
              ["主语", "Kate's dad"],
              ["谓语", "told"],
              ["间接宾语", "them"],
              ["宾语从句", "<code>that the important pots were still under the ground</code>"]
            ],
            clauses: ["that 引导宾语从句"],
            gram: ["tell sb that 从句", "宾语从句"],
            tip: "<b>tell sb (that)...</b> 是“告诉某人……”。that 在宾语从句里只起连接作用、不作成分，口语里常省略。注意 <code>still</code> 的位置——放在 be 动词后面。",
            phrases: ["under the ground"]
          }
        },
        {
          s: "And because no-one had touched them for centuries, the team would learn far more about their history – but first they would have to dig deeper.",
          hard: true,
          tr: "而且因为几百年来没人碰过它们，团队能了解到关于它们历史的多得多的信息——但首先，他们得挖得更深。",
          ana: {
            pat: ["主谓宾", "并列句", "原因状语从句"],
            frame: "主干：<b>the team would learn far more</b>（团队能了解到多得多的东西）",
            parts: [
              ["原因状语从句", "<code>because no-one had touched them for centuries</code>"],
              ["主语", "the team"],
              ["谓语", "<code>would learn</code> —— 过去将来时"],
              ["宾语", "<code>far more</code> —— far 修饰比较级 more"],
              ["定语", "about their history"],
              ["转折分句", "<code>but first they would have to dig deeper</code>"]
            ],
            clauses: ["because 原因状语从句", "but 连接并列分句", "过去完成时", "过去将来时"],
            gram: ["原因状语从句", "过去完成时", "过去将来时", "far + 比较级"],
            tip: "两个考点：① <b>far 修饰比较级</b>，表示”…得多“，同类还有 much / a lot / even + 比较级；② <b>would</b> 是过去将来时——因为整篇都在讲过去的事，”将会了解“就要退一步说成 would learn。",
            phrases: ["far more", "dig deeper", "for centuries"]
          }
        },
        {
          s: "Says Kate, '{17}But we all knew Dad was right!'",
          tr: "凯特说：“但我们都清楚爸爸是对的！”",
          ana: {
            pat: ["倒装引语", "宾语从句"],
            frame: "主干：<b>we all knew (that) Dad was right</b>（我们都知道爸爸是对的）",
            parts: [
              ["谓语 + 主语", "<code>Says Kate</code> —— 引语倒装"],
              ["主语", "we"],
              ["状语", "<code>all</code> —— 放在实义动词前，表示“全都”"],
              ["谓语", "knew"],
              ["宾语从句", "<code>(that) Dad was right</code> —— 省略了 that"]
            ],
            clauses: ["宾语从句省略 that", "引语倒装"],
            gram: ["宾语从句省略 that", "all 的位置"],
            tip: "<b>all</b> 作同位语时位置很关键：放在实义动词<b>前</b>（we all knew），但放在 be 动词<b>后</b>（we were all）。这是常考的语序点。",
            phrases: ["all knew"]
          }
        }
      ],

      /* ---------- 第 5 段 ---------- */
      [
        {
          s: "The site was divided into small squares, with a leader for each square, who told everyone how to dig.",
          hard: true,
          tr: "现场被划分成一个个小方块，每个方块有一名负责人，负责告诉大家怎么挖。",
          ana: {
            pat: ["主谓宾", "被动语态", "with 复合结构", "非限制性定语从句"],
            frame: "主干：<b>The site was divided into small squares</b>（现场被划分成小方块）",
            parts: [
              ["主语", "The site"],
              ["谓语", "<code>was divided</code> —— 被动语态"],
              ["状语", "into small squares"],
              ["伴随状语", "<code>with a leader for each square</code> —— with + 名词，附带说明"],
