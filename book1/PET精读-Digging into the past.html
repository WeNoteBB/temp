<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PET 精读 · Digging into the past</title>
<style>
/* ===== PET 精读自学页 ===== */
:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --ink:#1e2430;
  --ink-2:#5a6474;
  --ink-3:#8b95a6;
  --line:#e3e7ee;
  --line-2:#eef1f6;
  --accent:#2f6fed;
  --accent-soft:#e8f0ff;
  --phrase:#ffe98a;
  --phrase-hover:#ffd93d;
  --ins-bg:#e7f6ec;
  --ins-line:#3aa864;
  --hard:#e8833a;
  --hard-bg:#fdf1e6;
  --radius:10px;
  --shadow:0 1px 3px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.05);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:0}

.tabs{display:flex;gap:4px;background:var(--line-2);padding:3px;border-radius:var(--radius)}
.tab{
  padding:6px 16px;border-radius:7px;font-size:14px;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.spacer{flex:1}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;color:var(--ink-2);background:var(--panel);
  transition:all .15s;
}
.tool:hover{border-color:#c9d3e4;color:var(--ink)}
.tool.on{background:var(--accent-soft);border-color:#b9cffb;color:var(--accent);font-weight:600}
.voice-warn{
  font-size:12px;color:#a8641a;background:#fdf3e3;border:1px solid #f2ddb8;
  padding:4px 10px;border-radius:7px;
}

/* ---------- 三列 ---------- */
.cols{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1.25fr);
  gap:14px;padding:14px;
  flex:1;min-height:0;
}
.col{
  background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;
}
.col-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 16px;border-bottom:1px solid var(--line-2);
  font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;flex:none;
}
.col-head .hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.col-body{overflow-y:auto;padding:16px;flex:1;scroll-behavior:smooth}
.col-body::-webkit-scrollbar{width:9px}
.col-body::-webkit-scrollbar-thumb{background:#d6dce8;border-radius:5px}
.col-body::-webkit-scrollbar-thumb:hover{background:#c2cbdb}

/* ---------- 原文 ---------- */
.passage-title{
  font-size:20px;font-weight:700;margin:2px 0 4px;letter-spacing:.2px;
}
.passage-meta{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.para{margin:0 0 15px}
.sent{
  display:block;position:relative;
  padding:3px 0 3px 0;border-radius:6px;
  transition:background .18s;
}
.sent.cur{background:#f7faff;box-shadow:inset 3px 0 0 var(--accent);padding-left:10px;margin-left:-10px}
.sent-txt{}

/* 单词 */
.w{
  border-radius:4px;padding:1px 1px;cursor:pointer;
  transition:background .12s,color .12s;
}
.w:hover{background:var(--accent-soft);color:var(--accent)}
.w.known{background:#eef7f0}
.w.known:hover{background:#d9eedd}
.w.act{background:var(--accent);color:#fff}

/* 词组 */
.ph{
  background:var(--phrase);border-radius:4px;padding:1px 2px;cursor:pointer;
  box-shadow:inset 0 -1px 0 rgba(180,140,0,.25);
  transition:background .12s;
}
.ph:hover{background:var(--phrase-hover)}
.ph.act{background:var(--accent);color:#fff;box-shadow:none}

/* 填空题干与答案句 */
.blank{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:22px;padding:0 7px;margin:0 3px;
  background:#eef1f6;border:1.5px dashed #b9c3d4;border-radius:6px;
  font-size:12.5px;font-weight:700;color:var(--ink-3);vertical-align:1px;
  cursor:pointer;transition:all .15s;
}
.blank:hover{border-color:var(--accent);color:var(--accent)}
.blank.filled{background:var(--ins-bg);border:1.5px solid var(--ins-line);color:#1d7a45}
.blank.act{background:var(--accent);border-color:var(--accent);color:#fff}
.ins{
  background:var(--ins-bg);border-radius:4px;padding:1px 3px;
  box-shadow:inset 0 -1.5px 0 var(--ins-line);
}
body.quiz .ins{background:transparent;box-shadow:none;color:var(--ink-3)}
body.quiz .blank{background:#eef1f6;border-style:dashed;border-color:#b9c3d4;color:var(--ink-3)}

/* 长难句 */
.sent.hard{background:var(--hard-bg);padding:4px 10px 4px 9px;margin-left:-9px;border-left:3px solid var(--hard)}
.sent.hard.cur{background:#fdf5ec}

/* 行内按钮 */
.row-btns{
  display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px;
  opacity:.45;transition:opacity .15s;
}
.sent:hover .row-btns,.sent.cur .row-btns{opacity:1}
.mini{
  width:24px;height:22px;border-radius:5px;font-size:12px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);transition:all .12s;
}
.mini:hover{background:var(--accent-soft);color:var(--accent)}
.mini.on{background:var(--accent);color:#fff}
.mini.speaking{background:#ffe1e1;color:#d64545}

/* 翻译 */
.tr{
  display:none;margin:5px 0 2px;padding:8px 11px;
  background:#f7f9fc;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  font-size:14px;color:var(--ink-2);line-height:1.75;
}
.tr.show{display:block}
body.alltr .tr{display:block}

/* ---------- 生词本 ---------- */
.empty{
  color:var(--ink-3);font-size:13.5px;text-align:center;
  padding:36px 16px;line-height:1.9;
}
.empty .big{font-size:26px;display:block;margin-bottom:8px;opacity:.5}
.vcard{
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px;
  animation:pop .22s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.vcard.phrase{border-color:#e8d48a;background:#fffdf4}
.vcard .vt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vcard .vw{font-size:17px;font-weight:700;letter-spacing:.2px}
.vcard .vipa{font-size:13px;color:var(--accent);font-family:"Segoe UI",system-ui,sans-serif}
.vcard .vpos{
  font-size:11px;font-weight:700;color:#fff;background:var(--ink-3);
  padding:1.5px 7px;border-radius:20px;letter-spacing:.3px;
}
.vcard.phrase .vpos{background:#c79a12}
.vcard .vcn{font-size:14.5px;margin-top:6px;line-height:1.7}
.vcard .vctx{
  font-size:12.5px;color:var(--ink-3);margin-top:7px;padding-top:7px;
  border-top:1px dashed var(--line);line-height:1.6;
}
.vcard .vctx em{color:var(--ink-2);font-style:normal;background:#fff6d6;padding:0 2px;border-radius:3px}
.vcard .vrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.vcard .vspk{
  font-size:12px;color:var(--accent);border:1px solid #cfe0ff;background:#f5f9ff;
  padding:3px 10px;border-radius:6px;display:inline-flex;gap:5px;align-items:center;
}
.vcard .vspk:hover{background:var(--accent-soft)}
.vcard .vdel{font-size:12px;color:var(--ink-3);margin-left:auto;padding:3px 6px;border-radius:5px}
.vcard .vdel:hover{background:#fdeaea;color:#d64545}
.vcard .vnote{
  font-size:12.5px;color:var(--ink-2);background:#f7f9fc;
  border-radius:6px;padding:7px 10px;margin-top:8px;line-height:1.65;
}
.vcard .vph{
  font-size:12px;color:var(--ink-3);margin-top:8px;line-height:2;
}
.vcard .vphchip{
  display:inline-block;font-size:12px;padding:2px 9px;margin:0 4px 3px 0;
  background:var(--phrase);border-radius:20px;color:#6b5300;
  box-shadow:inset 0 -1px 0 rgba(180,140,0,.25);transition:background .12s;
}
.vcard .vphchip:hover{background:var(--phrase-hover)}

/* ---------- 句子分析 ---------- */
.ana{animation:pop .2s ease-out}
.ana-h{
  font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--ink-3);
  text-transform:uppercase;margin:0 0 10px;
}
.ana-sent{
  font-size:15px;line-height:1.8;background:#f7f9fc;border-radius:8px;
  padding:11px 13px;margin-bottom:13px;border-left:3px solid var(--accent);
}
.sec{margin-bottom:14px}
.sec-t{
  font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.sec-t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
.sec-b{font-size:14px;line-height:1.8;color:var(--ink-2)}
.sec-b b{color:var(--ink)}
.sec-b code{
  background:#eef1f6;padding:1px 6px;border-radius:4px;font-size:13px;
  font-family:"Cascadia Code",Consolas,monospace;color:#b3402f;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{
  font-size:12.5px;padding:3px 10px;border-radius:20px;
  background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip.cl{background:#eef3ff;border-color:#d3e0fb;color:#2b5bc4}
.chip.ph2{background:#fff8dd;border-color:#eddfa4;color:#8a6a05}
.chip.gr{background:#eefaf1;border-color:#c9ecd5;color:#1d7a45}

.struct{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:2px}
.struct td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.65}
.struct tr:last-child td{border-bottom:none}
.struct td:first-child{
  width:104px;color:var(--accent);font-weight:600;white-space:nowrap;font-size:12.5px;
}
.struct td:last-child{color:var(--ink-2)}
.struct code{background:#eef1f6;padding:0 5px;border-radius:3px;font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;color:#b3402f}

/* ---------- 题目 ---------- */
.qcard{
  border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;
  transition:border-color .15s,box-shadow .15s;
}
.qcard.open{border-color:#cfe0ff;box-shadow:0 2px 12px rgba(47,111,237,.09)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.qnum{
  width:27px;height:27px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.qtxt{font-size:15.5px;font-weight:600;line-height:1.75;flex:1}
.qans{
  display:flex;align-items:center;gap:9px;margin-top:11px;padding:10px 12px;
  background:var(--ins-bg);border-radius:8px;border:1px solid #c9ecd5;
}
.qans .lbl{font-size:12px;font-weight:700;color:#1d7a45;letter-spacing:.5px;flex:none}
.qans .letter{
  width:24px;height:24px;flex:none;border-radius:6px;background:#1d7a45;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.qans .atxt{flex:1;font-size:14.5px;line-height:1.7}
.qbtns{display:flex;gap:8px;margin-top:11px}
.btn{
  padding:6px 14px;border-radius:7px;font-size:13px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--panel);display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;
}
.btn:hover{border-color:#c9d3e4;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#2560d8;color:#fff}
.btn.on{background:var(--accent-soft);border-color:#b9cffb;color:var(--accent);font-weight:600}
.qbody{display:none;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.qbody.show{display:block}

.opt{
  display:flex;gap:10px;padding:9px 11px;border-radius:8px;margin-bottom:5px;
  font-size:14.5px;line-height:1.7;border:1px solid transparent;transition:all .15s;
}
.opt:hover{background:#f7f9fc}
.opt .ol{
  width:22px;height:22px;flex:none;border-radius:5px;background:var(--line-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
}
.opt.right{background:var(--ins-bg);border-color:#c9ecd5}
.opt.right .ol{background:#1d7a45;color:#fff}
.opt.wrong{opacity:.72}
.opt.used{background:#f4f6fa;border-color:var(--line)}
.opt .otxt{flex:1}
.opt .tag{
  font-size:11.5px;padding:1px 8px;border-radius:20px;align-self:flex-start;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap;flex:none;
}
.opt.right .tag{background:#1d7a45;color:#fff}
.opt.used .tag{background:#dfe4ee;color:var(--ink-2)}

.qa-sec{margin-top:13px}
.qa-sec:first-child{margin-top:0}
.qa-t{
  font-size:12.5px;font-weight:700;color:var(--accent);
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.qa-t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
.qa-b{font-size:14px;line-height:1.85;color:var(--ink-2)}
.qa-b b{color:var(--ink)}
.qa-b code{background:#eef1f6;padding:1px 6px;border-radius:4px;font-family:"Cascadia Code",Consolas,monospace;font-size:13px;color:#b3402f}

/* 窄屏 */
@media(max-width:1180px){
  .cols{grid-template-columns:1fr;height:auto;gap:12px}
  .col{max-height:78vh}
  .col-body{max-height:none}
}

</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PET 精读<small>Exam Practice Test 1 · Reading Part 4</small></div>

  <div class="tabs">
    <button class="tab on" data-tab="read">原文精读</button>
    <button class="tab" data-tab="quiz">题目分析</button>
  </div>

  <div class="spacer"></div>

  <div class="tools">
    <span class="voice-warn" id="voiceWarn" hidden></span>
    <button class="tool" id="tglQuiz">做题模式</button>
    <button class="tool" id="tglAllTr">全部翻译</button>
    <button class="tool" id="btnStop">⏹ 停止朗读</button>
    <button class="tool" id="btnClear">清空生词本</button>
  </div>
</div>

<div class="cols">
  <!-- 第一列：原文 / 题目 切换 -->
  <div class="col">
    <div class="col-head">
      <span id="col1Title">原文</span>
      <span class="hint" id="col1Hint">点词查词 · <span style="background:var(--phrase);padding:0 4px;border-radius:3px">黄色</span>是词组 · 🔊 0.75×英音</span>
    </div>
    <div class="col-body">
      <div id="passage"></div>
      <div id="qList" hidden></div>
    </div>
  </div>

  <!-- 第二列：生词本（两部分共用） -->
  <div class="col">
    <div class="col-head"><span>单词 / 词组</span><span class="hint">点词自动收录</span></div>
    <div class="col-body" id="vocab"></div>
  </div>

  <!-- 第三列：分析（两部分共用） -->
  <div class="col">
    <div class="col-head"><span>分析</span><span class="hint" id="col3Hint">点句子查看</span></div>
    <div class="col-body" id="analysis"></div>
  </div>
</div>

<script>
/* ============================================================
   PET 精读 · 内容数据
   来源：剑桥PET官方模考题精讲讲练 · Exam Practice Test 1 · Reading Part 4
   文章：Digging into the past（Questions 16–20，五选句填空）
   ============================================================ */
window.PET_CONTENT = {

  meta: {
    label: "Exam Practice Test 1 · Reading Part 4",
    note: "答案为依据上下文推断，请对照书后 P185 核对"
  },

  passage: {
    title: "Digging into the past",
    words: 319,
    sentences: 22,
    paragraphs: [

      /* ---------- 第 1 段 ---------- */
      [
        {
          s: "Last year, Kate Marshall was given a very exciting opportunity – to help her father, who's a history lecturer, at a historical site!",
          hard: true,
          tr: "去年，凯特·马歇尔得到了一个非常令人兴奋的机会——去一个历史遗址帮她父亲，她父亲是一位历史讲师！",
          ana: {
            frame: "主干：<b>Kate Marshall was given an opportunity</b>（凯特获得了一个机会）",
            parts: [
              ["主语", "Kate Marshall"],
              ["谓语", "<code>was given</code> —— 一般过去时的被动语态（was/were + 过去分词）"],
              ["宾语", "a very exciting opportunity"],
              ["同位语", "<code>to help her father ... at a historical site</code> —— 破折号引出的不定式，解释这个 opportunity 具体是什么"],
              ["定语从句", "<code>who's a history lecturer</code> —— 非限制性定语从句，补充说明 father"],
              ["地点状语", "at a historical site"]
            ],
            clauses: ["非限制性定语从句 who's...", "不定式作同位语（解释机会的内容）"],
            gram: ["被动语态", "非限制性定语从句", "不定式作同位语"],
            tip: "被动语态 <code>was given</code> 直译是“被给予”，中文习惯说成<b>“得到了”</b>。破折号后面的不定式要提到前面去译——先说“一个…的机会”，再说机会是什么。这是英文“先抽象后具体”、中文“先具体后抽象”的典型差异。",
            phrases: ["a very exciting opportunity", "a historical site", "history lecturer"]
          }
        },
        {
          s: "He was leading a team to dig up and explore the area.",
          tr: "他正带着一个团队挖掘并勘探这片区域。",
          ana: {
            frame: "主干：<b>He was leading a team</b>（他正带着一个团队）",
            parts: [
              ["主语", "He（指凯特的父亲）"],
              ["谓语", "<code>was leading</code> —— 过去进行时，表示当时正在进行的动作"],
              ["宾语", "a team"],
              ["目的状语", "<code>to dig up and explore the area</code> —— 不定式表目的，两个动词并列"]
            ],
            clauses: ["不定式作目的状语"],
            gram: ["过去进行时", "不定式表目的", "并列不定式"],
            tip: "英文目的状语放后面，中文习惯放前面：<b>“他正带着一个团队去挖掘和勘探这片区域”</b>。两个不定式 <code>dig up</code> 和 <code>explore</code> 共用一个 to，这叫“并列不定式”，第二个 to 省略。",
            phrases: ["dig up", "lead a team"]
          }
        }
      ],

      /* ---------- 第 2 段 ---------- */
      [
        {
          s: "When they arrived, though, the site wasn't quite what Kate had expected.",
          hard: true,
          tr: "不过，等他们到了之后，现场和凯特预想的不太一样。",
          ana: {
            frame: "主干：<b>the site wasn't quite what Kate had expected</b>（现场和凯特预想的不太一样）",
            parts: [
              ["时间状语从句", "<code>When they arrived</code>"],
              ["插入语", "<code>though</code> —— 插在句中表转折，前后加逗号"],
              ["主语", "the site"],
              ["系动词", "wasn't"],
              ["表语从句", "<code>what Kate had expected</code> —— what 引导的名词性从句作表语"]
            ],

<script>

(function () {

     一、状态
     ======================================================= */

  }

  /* =======================================================
     二、分词
     ======================================================= */
  // 把句子切成 词 / 标点空白 / 空位 三类片段
  var TOKEN_RE = /\{(\d+)\}|([A-Za-z]+(?:[’'\-][A-Za-z]+)*)/g;

  function tokenize(text) {
    var out = [], last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(text)) !== null) {
      if (m.index > last) out.push({ k: "p", v: text.slice(last, m.index) });
      if (m[1] !== undefined) out.push({ k: "b", v: m[1] });
      else out.push({ k: "w", v: m[2] });
      last = TOKEN_RE.lastIndex;
    }
    if (last < text.length) out.push({ k: "p", v: text.slice(last) });
    return out;
  }

  /* ---- 词组标注：最长优先，不重叠 ---- */
  function buildPhraseIndex(phrases) {
    var set = new Map(), max = 1;
    phrases.forEach(function (p) {
      var key = p.toLowerCase().trim().replace(/\s+/g, " ");
      var n = key.split(" ").length;
      if (n > max) max = n;
      set.set(key, p);
    });
    return { set: set, max: max };
  }

  // 返回 Map<tokenIndex, {key, end}> 与分组列表
  function markPhrases(tokens, pidx) {
    var wi = [], wl = [];                 // 词 token 的下标 / 小写词形
    tokens.forEach(function (t, i) {
      if (t.k === "w") { wi.push(i); wl.push(t.v.toLowerCase()); }
    });
    // 两个词之间只能有空白，夹了标点就不算一个词组
    function onlySpaceBetween(a, b) {
      for (var k = wi[a] + 1; k < wi[b]; k++) {
        if (tokens[k].k !== "p" || /\S/.test(tokens[k].v)) return false;
      }
      return true;
    }

    var groups = [], taken = new Set();
    for (var n = pidx.max; n >= 2; n--) {
      for (var i = 0; i + n <= wl.length; i++) {
        var free = true;
        for (var j = 0; j < n; j++) {
          if (taken.has(wi[i + j]) || (j > 0 && !onlySpaceBetween(i + j - 1, i + j))) {
            free = false; break;
          }
        }
        if (!free) continue;
        var key = wl.slice(i, i + n).join(" ");
        if (pidx.set.has(key)) {
          for (var q = 0; q < n; q++) taken.add(wi[i + q]);
          groups.push({ from: wi[i], to: wi[i + n - 1], key: key, label: pidx.set.get(key) });
          i += n - 1;
        }
      }
    }
    return groups;
  }

  /* ---- 查词回退：原形 → 小写 → 去屈折 ---- */
  function dedouble(s) {
    return /([bdfglmnprt])\1$/.test(s) ? s.slice(0, -1) : null;
  }
  function lookup(raw) {
    var g = C.glossary;
    var low = raw.toLowerCase();
    var cands = [low];
    function add(x) { if (x && x.length > 1 && cands.indexOf(x) < 0) cands.push(x); }

    if (/[’']s$/.test(low)) add(low.replace(/[’']s$/, ""));
    if (low.slice(-3) === "ies") add(low.slice(0, -3) + "y");
    if (low.slice(-4) === "ives") add(low.slice(0, -4) + "ife");
    if (low.slice(-2) === "es") add(low.slice(0, -2));
    if (low.slice(-1) === "s") add(low.slice(0, -1));
    if (low.slice(-3) === "ing") {
      add(low.slice(0, -3)); add(low.slice(0, -3) + "e");
      add(dedouble(low.slice(0, -3)));
    }
    if (low.slice(-2) === "ed") {
      add(low.slice(0, -2)); add(low.slice(0, -1));
      add(dedouble(low.slice(0, -2)));
    }
    if (low.slice(-3) === "ies") add(low.slice(0, -3) + "y");
    if (low.slice(-2) === "er") { add(low.slice(0, -2)); add(dedouble(low.slice(0, -2))); }
    if (low.slice(-3) === "est") { add(low.slice(0, -3)); add(dedouble(low.slice(0, -3))); }

    for (var i = 0; i < cands.length; i++) {
      if (g[cands[i]]) return { key: cands[i], entry: g[cands[i]], matched: cands[i] !== low };
    }

  }

    var e = C.glossary[key];

  }

  var TTS = (function () {
    var voices = [], chosen = null, checked = false;
    var btn = null;

    function pick() {
      var list = speechSynthesis.getVoices() || [];
      if (!list.length) return;

      checked = true;

      chosen =

        gb.filter(function (v) { return /libby|sonia|hazel|serena|kate|stephanie|ryan|george|thomas|oliver/i.test(v.name); })[0] ||
        gb[0] ||
        list.filter(function (v) { return /^en/i.test(v.lang); })[0] ||
        null;
      renderNotice();
    }

    function renderNotice() {
      var el = document.getElementById("voiceWarn");
      if (!el) return;
      if (!checked) { el.hidden = true; return; }
      if (!chosen) {
        el.hidden = false;
        el.textContent = "⚠ 系统没找到英语语音，朗读可能不可用";
      } else if (!/^en[-_]GB/i.test(chosen.lang)) {
        el.hidden = false;
        el.textContent = "⚠ 未找到英音(" + chosen.lang + ")，已退回：" + chosen.name;
      } else {
        el.hidden = true;
      }
    }

    function speak(text, button) {
      if (!("speechSynthesis" in window)) {
        alert("这个浏览器不支持语音朗读，建议用 Edge 或 Chrome 打开。");
        return;
      }
      speechSynthesis.cancel();               // 互斥：掐掉上一句
      if (btn) { btn.classList.remove("speaking"); btn = null; }

      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = 0.75;                           // 0.75 倍速
      u.pitch = 1;
      if (chosen) u.voice = chosen;
      if (button) {
        btn = button;
        btn.classList.add("speaking");
      }
      u.onend = u.onerror = function () {
        if (btn) { btn.classList.remove("speaking"); btn = null; }
      };
      speechSynthesis.speak(u);
    }

    function stop() {
      speechSynthesis.cancel();
      if (btn) { btn.classList.remove("speaking"); btn = null; }
    }

      pick();
      speechSynthesis.onvoiceschanged = pick;

      setTimeout(pick, 300);
      setTimeout(pick, 1200);
    }

  })();

  /* =======================================================
     四、渲染 · 原文
     ======================================================= */
  var elPassage, elVocab, elAna;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];

  // 把一句原文渲染成 HTML（词 / 词组 / 空位）
  function renderSentence(sent) {
    var tokens = tokenize(sent.s);
    var groups = markPhrases(tokens, PHRASE_IDX);

    // tokenIndex -> 词组信息
    var phAt = new Map();
    groups.forEach(function (g) {
      for (var i = g.from; i <= g.to; i++) phAt.set(i, g);
    });

    var html = "", i = 0;
    while (i < tokens.length) {
      var t = tokens[i];
      if (t.k === "p") {
        html += esc(t.v);
        i++;
      } else if (t.k === "b") {
        html += renderBlank(t.v);
        i++;
      } else {
        var g = phAt.get(i);
        if (g && g.from === i) {
          // 整段词组

          for (var j = g.from; j <= g.to; j++) {
            inner += '<span class="w" data-w="' + esc(tokens[j].v) + '">' + esc(tokens[j].v) + "</span>";
            if (j < g.to && tokens[j + 1].k === "p") inner += esc(tokens[j + 1].v);
          }
          html += '<span class="ph" data-ph="' + esc(g.key) + '">' + inner + "</span>";
          // 词组占用的词已全部渲染；后面的标点/空格交给主循环，别吞掉
          i = g.to + 1;
        } else {
          html += '<span class="w" data-w="' + esc(t.v) + '">' + esc(t.v) + "</span>";
          i++;
        }
      }
    }
    return html;
  }
  function renderBlank(n) {
    var q = C.questions.filter(function (x) { return String(x.n) === String(n); })[0];
    var filled = q && q.answer;
    var cls = "blank" + (filled ? " filled" : "");
    return '<span class="' + cls + '" data-blank="' + n + '">' + n + "</span>";
  }

  function buildPassage() {

    h += '<h1 class="passage-title">' + esc(C.passage.title) + "</h1>";
    h += '<div class="passage-meta">' + esc(C.meta.label) + " · " + C.passage.words + " 词 · " +
      C.passage.sentences + " 句 · 长难句 " + countHard() + " 句</div>";

        var cls = "sent" + (sent.hard ? " hard" : "");
        h += '<span class="' + cls + '" data-sent="' + pi + "-" + si + '">';
        h += '<span class="sent-txt">' + renderSentence(sent) + "</span>";
        h += '<span class="row-btns">';
        h += '<button class="mini spk" data-say="' + pi + "-" + si + '" title="0.75倍速英音朗读">🔊</button>';
        h += '<button class="mini trb" data-tr="' + pi + "-" + si + '" title="显示/隐藏翻译">译</button>';
        h += "</span>";
        if (sent.tr) h += '<span class="tr" data-trbox="' + pi + "-" + si + '">' + esc(sent.tr) + "</span>";
        h += "</span> ";
      });
      h += "</p>";
    });
    return h;
  }

  function countHard() {
    var n = 0;
    C.passage.paragraphs.forEach(function (p) {
      p.forEach(function (s) { if (s.hard) n++; });
    });
    return n;
  }

  /* =======================================================
     五、渲染 · 生词本
     ======================================================= */
  function vocabKeyOf(type, key) { return type + ":" + key; }

  function addVocab(type, key, entry, ctxSent) {
    var id = vocabKeyOf(type, key);
    state.vocab = state.vocab.filter(function (v) { return v.id !== id; });
    state.vocab.unshift({ id: id, type: type, key: key, entry: entry, ctx: ctxSent || "" });
    if (state.vocab.length > 200) state.vocab.length = 200;
    saveVocab();
    renderVocab();
  }

  function renderVocab() {
    if (!state.vocab.length) {
      elVocab.innerHTML =
        '<div class="empty"><span class="big">📖</span>' +
        "点左边的<b>单词</b>查词<br>点<b>黄色词组</b>看搭配<br><br>" +
        "查过的会攒在这里，<br>这一课学完就是一份复习清单。" +
        "</div>";
      return;
    }
    var h = "";
    state.vocab.forEach(function (v) {
      var e = v.entry;
      var isPh = v.type === "phrase";
      h += '<div class="vcard' + (isPh ? " phrase" : "") + '">';
      h += '<div class="vt">';
      h += '<span class="vw">' + esc(v.key) + "</span>";
      if (e.ipa) h += '<span class="vipa">' + esc(e.ipa) + "</span>";
      if (e.pos) h += '<span class="vpos">' + esc(e.pos) + "</span>";
      h += "</div>";
      h += '<div class="vcn">' + e.cn + "</div>";
      if (e.note) h += '<div class="vnote">' + e.note + "</div>";
      if (!isPh) {
        var rel = phrasesWith(v.key);
        if (rel.length) {
          h += '<div class="vph">包含它的词组：';
          rel.slice(0, 4).forEach(function (p) {
            h += '<button class="vphchip" data-vph="' + esc(p) + '">' + esc(p) + "</button>";
          });
          h += "</div>";
        }
      }
      if (v.ctx) {
        h += '<div class="vctx">原文：' + highlightCtx(v.ctx, v.key) + "</div>";
      }
      h += '<div class="vrow">';
      h += '<button class="vspk" data-vsay="' + esc(v.key) + '">🔊 0.75×</button>';
      h += '<button class="vdel" data-vdel="' + esc(v.id) + '">移除</button>';
      h += "</div></div>";
    });
    elVocab.innerHTML = h;
  }

  // 找出包含某个词的词组
  function phrasesWith(word) {
    var w = word.toLowerCase();
    return C.phrases.filter(function (p) {
      return p.toLowerCase().split(/\s+/).indexOf(w) >= 0;
    });
  }

  function highlightCtx(ctx, key) {
    var safe = esc(ctx);
    var k = esc(key);
    var re = new RegExp("\\b(" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "gi");
    return safe.replace(re, "<em>$1</em>");
  }

  /* =======================================================
     六、渲染 · 句子分析
     ======================================================= */
  function findSent(ref) {
    var p = ref.split("-");
    return C.passage.paragraphs[+p[0]][+p[1]];
  }

  function showAnalysis(ref) {
    var s = findSent(ref);
    var h = '<div class="ana">';
    h += '<div class="ana-h">句子分析</div>';
    h += '<div class="ana-sent">' + esc(s.s.replace(/\{\d+\}/g, "____")) + "</div>";

    if (s.tr) {
      h += '<div class="sec"><div class="sec-t">翻译</div><div class="sec-b">' + esc(s.tr) + "</div></div>";
    }
    if (s.ana) {
      var a = s.ana;
      if (a.frame) {
        h += '<div class="sec"><div class="sec-t">句子骨架</div><div class="sec-b">' + a.frame + "</div></div>";
      }
      if (a.parts && a.parts.length) {
        h += '<div class="sec"><div class="sec-t">成分拆解</div><table class="struct">';
        a.parts.forEach(function (p) {
          h += "<tr><td>" + p[0] + "</td><td>" + p[1] + "</td></tr>";
        });
        h += "</table></div>";
      }
      if (a.clauses && a.clauses.length) {
        h += '<div class="sec"><div class="sec-t">从句 / 语法点</div><div class="chips">';
        a.clauses.forEach(function (c) { h += '<span class="chip cl">' + c + "</span>"; });
        h += "</div></div>";
      }
      if (a.tip) {
        h += '<div class="sec"><div class="sec-t">翻译思路</div><div class="sec-b">' + a.tip + "</div></div>";
      }
      if (a.phrases && a.phrases.length) {
        h += '<div class="sec"><div class="sec-t">本句词组</div><div class="chips">';
        a.phrases.forEach(function (c) { h += '<span class="chip ph2">' + c + "</span>"; });
        h += "</div></div>";
      }
      if (a.gram && a.gram.length) {
        h += '<div class="sec"><div class="sec-t">考点</div><div class="chips">';
        a.gram.forEach(function (c) { h += '<span class="chip gr">' + c + "</span>"; });
        h += "</div></div>";
      }
    } else {
      h += '<div class="sec"><div class="sec-b" style="color:var(--ink-3)">' +
        "这是一句常规句，没有复杂的从句结构。点带 <b>橙色左边框</b> 的句子看长难句拆解。" +
        "</div></div>";
    }
    h += "</div>";
    elAna.innerHTML = h;
  }

  /* =======================================================
     七、渲染 · 题目
     ======================================================= */
  function buildQuestions() {
    var h = "";

    // 选项池
    var usedMap = {};
    C.questions.forEach(function (q) { if (q.answer) usedMap[q.answer] = q.n; });

    h += '<div class="qcard" style="background:#fbfcfe">';
    h += '<div class="qhead"><span class="qnum" style="background:var(--ink-3)">A–H</span>' +
      '<span class="qtxt">备选句（8 选 5，多出 3 句是干扰项）</span></div>';
    Object.keys(C.options).forEach(function (L) {
      var used = usedMap[L];
      h += '<div class="opt' + (used ? " used" : "") + '" data-opt="' + L + '">';
      h += '<span class="ol">' + L + "</span>";
      h += '<span class="otxt">' + renderSentence({ s: C.options[L] }) + "</span>";
      h += '<button class="mini spk" data-sayraw="' + esc(C.options[L]) + '" title="朗读">🔊</button>';
      h += '<span class="tag">' + (used ? "→ 第 " + used + " 空" : "干扰项") + "</span>";
      h += "</div>";
    });
    h += "</div>";

    // 逐题
    C.questions.forEach(function (q) {
      var open = !!state.openQ[q.n];
      h += '<div class="qcard' + (open ? " open" : "") + '" data-q="' + q.n + '">';
      h += '<div class="qhead"><span class="qnum">' + q.n + "</span>";
      h += '<span class="qtxt">' + esc(q.prompt) + "</span></div>";

      h += '<div class="qbtns">';
      h += '<button class="btn pri" data-qbtn="' + q.n + '">' + (open ? "收起分析" : "分析") + "</button>";
      h += '<button class="btn" data-qsay="' + q.n + '">🔊 朗读答案 0.75×</button>';
      h += "</div>";

      h += '<div class="qbody' + (open ? " show" : "") + '">';
      h += '<div class="qans"><span class="lbl">答案</span><span class="letter">' + q.answer + "</span>" +
        '<span class="atxt">' + renderSentence({ s: C.options[q.answer] }) + "</span>" +
        '<button class="mini spk" data-sayraw="' + esc(C.options[q.answer]) + '">🔊</button></div>';

      h += '<div class="qa-sec"><div class="qa-t">为什么选它</div><div class="qa-b">' + q.why + "</div></div>";
      h += '<div class="qa-sec"><div class="qa-t">线索词 / 衔接</div><div class="chips">';
      q.clues.forEach(function (c) { h += '<span class="chip cl">' + c + "</span>"; });
      h += "</div></div>";
      h += '<div class="qa-sec"><div class="qa-t">其他选项为什么不行</div><div class="qa-b">' +
        q.others.map(function (o) { return "<b>" + o[0] + "</b> — " + o[1]; }).join("<br>") + "</div></div>";
      if (q.tip) {
        h += '<div class="qa-sec"><div class="qa-t">做题方法</div><div class="qa-b">' + q.tip + "</div></div>";
      }
      h += "</div></div>";
    });

    return h;
  }

  function showQAnalysis(n) {
    var q = C.questions.filter(function (x) { return x.n === n; })[0];
    if (!q) return;
    var h = '<div class="ana">';
    h += '<div class="ana-h">第 ' + n + ' 题 · 题目分析</div>';
    h += '<div class="ana-sent">' + esc(q.prompt) + "</div>";

    h += '<div class="sec"><div class="sec-t">正确答案</div><div class="sec-b">' +
      '<b>' + q.answer + "</b> — " + esc(C.options[q.answer]) + "</div></div>";

    h += '<div class="sec"><div class="sec-t">解题思路</div><div class="sec-b">' + q.why + "</div></div>";

    if (q.ana) {
      var a = q.ana;
      if (a.parts && a.parts.length) {
        h += '<div class="sec"><div class="sec-t">答案句拆解</div><table class="struct">';
        a.parts.forEach(function (p) { h += "<tr><td>" + p[0] + "</td><td>" + p[1] + "</td></tr>"; });
        h += "</table></div>";
      }
      if (a.gram && a.gram.length) {
        h += '<div class="sec"><div class="sec-t">语法 / 搭配</div><div class="chips">';
        a.gram.forEach(function (c) { h += '<span class="chip gr">' + c + "</span>"; });
        h += "</div></div>";
      }
      if (a.tr) {
        h += '<div class="sec"><div class="sec-t">答案句翻译</div><div class="sec-b">' + esc(a.tr) + "</div></div>";
      }
    }

    h += '<div class="sec"><div class="sec-t">干扰项</div><div class="sec-b">' +
      q.others.map(function (o) { return "<b>" + o[0] + "</b> — " + o[1]; }).join("<br>") + "</div></div>";

    h += "</div>";
    elAna.innerHTML = h;
  }

  /* =======================================================
     八、事件
     ======================================================= */
  function ctxOf(sentEl) {
    var box = sentEl.querySelector(".sent-txt");
    return box ? box.textContent.trim().replace(/\s+/g, " ") : "";
  }

  function bindPassage(root) {
    root.addEventListener("click", function (ev) {
      var t = ev.target;

      // 单词优先：被词组包住的词，点的仍然是那个词
      var w = t.closest(".w");
      if (w) {
        var raw = w.dataset.w;
        var res = lookup(raw);
        markActive(w);
        if (res) {
          addVocab("word", raw, res.entry, ctxOf(w.closest(".sent") || root));
        } else {
          addVocab("word", raw, { pos: "", ipa: "", cn: "（未收录）", note: "这个词没进词表，可以补进去。" },
            ctxOf(w.closest(".sent") || root));
        }
        return;
      }

      // 词组：点黄色区域本身（词与词之间的空档、内边距）才落到词组
      var ph = t.closest(".ph");
      if (ph) {
        var key = ph.dataset.ph;
        var r = lookupPhrase(key);
        markActive(ph);
        if (r) addVocab("phrase", r.key, r.entry, ctxOf(ph.closest(".sent") || root));
        else addVocab("phrase", key, { pos: "phrase", ipa: "", cn: "（词组释义待补）" },
          ctxOf(ph.closest(".sent") || root));
        return;
      }

      // 空位
      var bl = t.closest(".blank");
      if (bl) {
        var n = +bl.dataset.blank;
        toggleQ(n);
        return;
      }

      // 喇叭
      var spk = t.closest(".spk");
      if (spk) {
        ev.stopPropagation();
        if (spk.dataset.sayraw) { TTS.speak(spk.dataset.sayraw, spk); return; }
        var s = findSent(spk.dataset.say);
        TTS.speak(cleanSay(s.s), spk);
        return;
      }

      // 翻译按钮
      var trb = t.closest(".trb");
      if (trb) {
        ev.stopPropagation();
        var box = root.querySelector('[data-trbox="' + trb.dataset.tr + '"]');
        if (box) { box.classList.toggle("show"); trb.classList.toggle("on"); }
        return;
      }

      // 句子 → 右栏分析
      var se = t.closest(".sent");
      if (se) {
        root.querySelectorAll(".sent.cur").forEach(function (x) { x.classList.remove("cur"); });
        se.classList.add("cur");
        showAnalysis(se.dataset.sent);
      }
    });
  }

  function cleanSay(s) {
    return s.replace(/\{\d+\}/g, " ").replace(/\s+/g, " ").trim();
  }

  function markActive(el) {
    var scope = el.closest(".col-body") || document;
    scope.querySelectorAll(".w.act,.ph.act").forEach(function (x) { x.classList.remove("act"); });
    el.classList.add("act");
  }

  function bindQuestions(root) {
    root.addEventListener("click", function (ev) {
      var t = ev.target;
      var spk = t.closest(".spk");
      if (spk) { ev.stopPropagation(); TTS.speak(spk.dataset.sayraw || "", spk); return; }

      var w = t.closest(".w");
      if (w) {
        var raw = w.dataset.w, res = lookup(raw);
        markActive(w);
        if (res) addVocab("word", raw, res.entry, "");
        else addVocab("word", raw, { pos: "", ipa: "", cn: "（未收录）" }, "");
        return;
      }

      var qb = t.closest("[data-qbtn]");
      if (qb) { toggleQ(+qb.dataset.qbtn); return; }

      var qs = t.closest("[data-qsay]");
      if (qs) {
        var q = C.questions.filter(function (x) { return x.n === +qs.dataset.qsay; })[0];
        if (q) TTS.speak(C.options[q.answer], qs);
        return;
      }
    });
  }

  function toggleQ(n) {
    var card = document.querySelector('[data-q="' + n + '"]');
    if (!card) { state.openQ[n] = !state.openQ[n]; renderQuestions(); return; }
    state.openQ[n] = !state.openQ[n];
    var body = card.querySelector(".qbody");
    var btn = card.querySelector("[data-qbtn]");
    if (state.openQ[n]) {
      body.classList.add("show"); card.classList.add("open"); btn.textContent = "收起分析";
      showQAnalysis(n);
    } else {
      body.classList.remove("show"); card.classList.remove("open"); btn.textContent = "分析";
    }
    // 某些环境（如无头浏览器）没有 scrollIntoView，缺了也不该中断流程
    if (card.scrollIntoView) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function bindVocab(root) {
    root.addEventListener("click", function (ev) {
      var s = ev.target.closest("[data-vsay]");
      if (s) { TTS.speak(s.dataset.vsay, s); return; }
      var d = ev.target.closest("[data-vdel]");
      if (d) {
        state.vocab = state.vocab.filter(function (v) { return v.id !== d.dataset.vdel; });
        saveVocab(); renderVocab();
        return;
      }
      var pc = ev.target.closest("[data-vph]");
      if (pc) {
        var r = lookupPhrase(pc.dataset.vph);
        if (r) addVocab("phrase", r.key, r.entry, "");
      }
    });
  }

  /* =======================================================
     九、装配
     ======================================================= */
  var PHRASE_IDX;

  function renderPassage() {
    elPassage.innerHTML = buildPassage();
  }
  function renderQuestions() {
    document.getElementById("qList").innerHTML = buildQuestions();
  }

  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".tab").forEach(function (b) {
      b.classList.toggle("on", b.dataset.tab === tab);
    });
    var isRead = tab === "read";
    document.getElementById("passage").hidden = !isRead;
    document.getElementById("qList").hidden = isRead;
    document.getElementById("col1Title").textContent = isRead ? "原文" : "题目与答案";
    document.getElementById("col1Hint").innerHTML = isRead
      ? '点词查词 · <span style="background:var(--phrase);padding:0 4px;border-radius:3px">黄色</span>是词组 · 🔊 0.75×英音'
      : "点「分析」看解析 · 点选项里的词也能查";
    document.getElementById("col3Hint").textContent = isRead ? "点句子查看" : "点「分析」查看";
    elAna.innerHTML = '<div class="empty"><span class="big">🔍</span>' +
      (isRead
        ? '点左边任意句子<br>这里显示句子分析<br><br>带<span style="color:var(--hard)">橙色左边框</span>的是长难句'
        : "点题目的「分析」按钮<br>这里显示题目解析") + "</div>";
  }

  function init() {
    PHRASE_IDX = buildPhraseIndex(C.phrases);
    elPassage = document.getElementById("passage");
    elVocab = document.getElementById("vocab");
    elAna = document.getElementById("analysis");

    loadVocab();
    renderPassage();
    renderVocab();
    renderQuestions();

    bindPassage(elPassage);
    bindVocab(elVocab);
    bindQuestions(document.getElementById("qList"));

    document.querySelectorAll(".tab").forEach(function (b) {
      b.addEventListener("click", function () { switchTab(b.dataset.tab); });
    });

    var tq = document.getElementById("tglQuiz");
    tq.addEventListener("click", function () {
      state.quiz = !state.quiz;
      document.body.classList.toggle("quiz", state.quiz);
      tq.classList.toggle("on", state.quiz);
      tq.textContent = state.quiz ? "✓ 做题模式" : "做题模式";
    });

    var ta = document.getElementById("tglAllTr");
    ta.addEventListener("click", function () {
      state.allTr = !state.allTr;
      document.body.classList.toggle("alltr", state.allTr);
      ta.classList.toggle("on", state.allTr);
      ta.textContent = state.allTr ? "✓ 全部翻译" : "全部翻译";
    });

    document.getElementById("btnClear").addEventListener("click", function () {
      if (!state.vocab.length) return;
      if (confirm("清空生词本？")) { state.vocab = []; saveVocab(); renderVocab(); }
    });

    document.getElementById("btnStop").addEventListener("click", function () { TTS.stop(); });

    switchTab("read");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
