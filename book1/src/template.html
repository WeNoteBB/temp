<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PET 精读 · Digging into the past</title>
<style>
/*__CSS__*/
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PET 精读<small>Exam Practice Test 1 · Reading Part 4</small></div>

  <div class="tabs">
    <button class="tab on" data-tab="read">原文精读</button>
    <button class="tab" data-tab="quiz">题目分析</button>
  </div>

  <div class="spacer"></div>

  <div class="tools">
    <span class="voice-warn" id="voiceWarn" hidden></span>

    <label class="zoom" title="只放大原文和小黑板，历史不受影响">
      <span id="zoomLabel">1x</span>
      <input type="range" id="zoomRange" min="1" max="5" step="0.5" value="1">
    </label>

    <button class="tool on" id="tglAna" title="显示 / 隐藏小黑板">▣ 小黑板</button>
    <button class="tool" id="tglVocab" title="显示 / 隐藏历史浮动面板">▣ 历史</button>
    <button class="tool" id="tglQuiz">做题模式</button>
    <button class="tool" id="btnStop">⏹ 停止朗读</button>
    <button class="tool" id="btnClear">清空历史</button>
    <button class="tool" id="btnMail" disabled
            title="要从服务器打开这个页面才能发送（双击本地文件时不可用）">📧 发送到邮箱</button>
    <span class="mail-msg" id="mailMsg" hidden></span>
  </div>
</div>

<!-- 两列各占一半。历史不在网格里，是右侧浮层 -->
<div class="cols">
  <!-- 第一列：原文 + 题目 -->
  <div class="col" id="col1">
    <div class="col-head">
      <span id="col1Title">原文</span>
      <span class="hint" id="col1Hint">点词查词 · 点句子看讲解 · <span style="background:var(--phrase);padding:0 4px;border-radius:3px">黄色</span>是词组</span>
    </div>
    <div class="col-body">
      <div id="passage"></div>
      <!-- 原文页 = 文章 + 题目。题目和文章一样：词可点、词组标黄、句子可讲解 -->
      <div id="qListRead" hidden></div>
      <div id="qList" hidden></div>
    </div>
  </div>

  <!-- 第二列：小黑板（点词 / 点句子 / 点答题解析都显示在这里） -->
  <div class="col" id="colAna">
    <div class="col-head">
      <span>小黑板</span>
      <span class="hint" id="colAnaHint">点单词或句子</span>
      <button class="collapse" data-collapse="ana" title="收起小黑板">✕</button>
    </div>
    <div class="col-body" id="analysis"></div>
  </div>
</div>

<!-- 历史：右侧浮层，点顶栏「历史」滑出。字体不参与缩放 -->
<aside class="hist-float" id="histFloat" hidden>
  <div class="hist-head">
    <span>历史</span>
    <span class="hist-hint">点过的都记在这 · 重复点击置顶</span>
    <button class="hist-close" id="histClose" title="收起历史">✕</button>
  </div>
  <div class="hist-body" id="history"></div>
</aside>

<script>
/*__CONTENT__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
