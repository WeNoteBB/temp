<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PET 精读 · Digging into the past</title>
<style>
/*__CSS__*/
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PET 精读<small>Exam Practice Test 1 · Reading Part 4</small></div>

  <div class="tabs">
    <button class="tab on" data-tab="read">原文精读</button>
    <button class="tab" data-tab="quiz">题目分析</button>
  </div>

  <div class="spacer"></div>

  <div class="tools">
    <span class="voice-warn" id="voiceWarn" hidden></span>
    <button class="tool on" id="tglAna" title="显示 / 隐藏右上角的句子分析栏">▣ 句子列</button>
    <button class="tool on" id="tglVocab" title="显示 / 隐藏右下角的单词栏">▣ 单词列</button>
    <button class="tool" id="tglQuiz">做题模式</button>
    <button class="tool" id="tglAllTr">全部翻译</button>
    <button class="tool" id="btnStop">⏹ 停止朗读</button>
    <button class="tool" id="btnClear">清空生词本</button>
  </div>
</div>

<!-- DOM 顺序 = col1 → colAna → colVocab。
     窄屏 grid-template-areas:none 后按 DOM 顺序流式排布，
     这个顺序让窄屏堆叠也是「原文 → 句子分析 → 单词」的阅读顺序 -->
<div class="cols">
  <!-- 左半，全高：原文 / 题目 切换 -->
  <div class="col" id="col1">
    <div class="col-head">
      <span id="col1Title">原文</span>
      <span class="hint" id="col1Hint">点词查词 · <span style="background:var(--phrase);padding:0 4px;border-radius:3px">黄色</span>是词组 · 🔊 0.75×英音</span>
    </div>
    <div class="col-body">
      <div id="passage"></div>
      <div id="qList" hidden></div>
    </div>
  </div>

  <!-- 右上半：句子分析 -->
  <div class="col" id="colAna">
    <div class="col-head">
      <span>句子分析</span>
      <span class="hint" id="colAnaHint">点句子查看 · 22 句都能点</span>
      <button class="collapse" data-collapse="ana" title="收起句子分析栏">✕</button>
    </div>
    <div class="col-body" id="analysis"></div>
  </div>

  <!-- 右下半：单词 / 词组 -->
  <div class="col" id="colVocab">
    <div class="col-head">
      <span>单词 / 词组</span>
      <span class="hint">点词自动收录 · 点一行展开</span>
      <button class="collapse" data-collapse="vocab" title="收起单词栏">✕</button>
    </div>
    <div class="col-body" id="vocab"></div>
  </div>
</div>

<script>
/*__CONTENT__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
